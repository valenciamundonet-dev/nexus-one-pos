name: Nexus One POS — CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npx prisma generate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  test-db:
    name: SQLite Health Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npx prisma db push --skip-generate
      - name: Verify schema
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.\$queryRaw\`SELECT count(*) FROM sqlite_master WHERE type='table'\`
            .then(r => { console.log('Tables OK:', r[0].count); process.exit(0); })
            .catch(e => { console.error('DB Error:', e); process.exit(1); });
          "

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, test-db]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build distribution zip
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ZIP_NAME=NexusOne-POS-v${VERSION}-Instalacion-Limpia
          mkdir -p dist
          mkdir -p /tmp/nexus-dist/${ZIP_NAME}

          cp -r src/ public/ prisma/ /tmp/nexus-dist/${ZIP_NAME}/

          cp package.json package-lock.json next.config.js tsconfig.json \
             postcss.config.js tailwind.config.ts .env.example \
             /tmp/nexus-dist/${ZIP_NAME}/ 2>/dev/null || true

          cp INSTALAR-LIMPIO.vbs PROGRESS.hta INSTALAR.bat \
             INICIAR-TODO.bat INICIAR-TODO-OCULTO.vbs DETENER-TODO.bat \
             CREAR-ADMIN.bat RESPALDAR-BD.bat SALUD-SISTEMA.bat \
             GENERAR-LICENCIA.bat GENERAR-LICENCIA.js \
             /tmp/nexus-dist/${ZIP_NAME}/ 2>/dev/null || true

          cp -r caddy/ printer-agent/ /tmp/nexus-dist/${ZIP_NAME}/ 2>/dev/null || true
          cp README.md /tmp/nexus-dist/${ZIP_NAME}/ 2>/dev/null || true

          cd /tmp/nexus-dist/${ZIP_NAME}
          rm -rf node_modules .next .git .env respaldos dist
          rm -f prisma/*.db prisma/*.db-journal prisma/*.db-wal prisma/*.db-shm

          cd /tmp/nexus-dist
          zip -r $GITHUB_WORKSPACE/dist/${ZIP_NAME}.zip ${ZIP_NAME}/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-test') }}
