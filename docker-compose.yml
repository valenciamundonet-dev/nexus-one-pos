# ─────────────────────────────────────────────────────────────
# Nexus One POS v2.9.73 — Docker Compose
#
# Servicios:
#   nexus-app    : Aplicacion Next.js (puerto 3000)
#   nexus-agent  : Agente de impresion ESC/POS (puerto 9100)
#
# Uso:
#   docker compose up -d          # Iniciar en segundo plano
#   docker compose logs -f         # Ver logs
#   docker compose down             # Detener y eliminar contenedores
#   docker compose up --build       # Reconstruir y levantar
# ─────────────────────────────────────────────────────────────

services:
  nexus-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-one-pos
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Persist SQLite database (WAL mode requires file access)
      - nexus-data:/app/prisma
      # Persist uploaded product images
      - nexus-uploads:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - APP_PORT=3000
      - PRINTER_AGENT_PORT=9100
      - JWT_SECRET=${JWT_SECRET:-cambiar-esta-clave-secreta-en-produccion}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/diagnostics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # NOTE: Printer agent requires Windows for winspool.drv.
  # In Docker (Linux), this service starts but cannot access
  # Windows printers. For production Windows deployments,
  # use INICIAR-TODO.ps1 or INICIAR-TODO.bat instead.
  nexus-agent:
    image: node:20-alpine
    container_name: nexus-print-agent
    working_dir: /app/printer-agent
    ports:
      - "${PRINTER_AGENT_PORT:-9100}:9100"
    volumes:
      - ./printer-agent:/app/printer-agent:ro
    environment:
      - PORT=9100
    command: ["node", "agent.js"]
    restart: unless-stopped
    profiles:
      # Only start printer agent when explicitly requested:
      #   docker compose --profile printer up -d
      - printer

volumes:
  nexus-data:
    driver: local
  nexus-uploads:
    driver: local
